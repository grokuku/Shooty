[package]
name = "astre-web"
description = "Astre — ABI WASM (cdylib, sans web-sys ni js-sys). Phase 3."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
# `cdylib` pour `wasm-pack --target web`, `rlib` pour pouvoir tester le crate sur l'hôte.
crate-type = ["rlib", "cdylib"]

# §B.5.2 : aucun `web-sys`, `js-sys` ni `wasm-bindgen-futures`. Le GPU et le DOM sont
# pilotés par la coquille TypeScript (`web/src/presenter.ts`).
[dependencies]
astre-core.workspace = true
astre-app.workspace = true
# Seule dépendance externe : le pont wasm-bindgen (aucun `web-sys`, aucun `js-sys`,
# aucune dépendance réseau). Le crate est aussi `rlib` pour être testable sur l'hôte.
wasm-bindgen.workspace = true

[lints]
workspace = true
