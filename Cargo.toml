# Workspace Shooty — le jeu. Le moteur de rendu vit dans HET (dépendances `git` + tag).
# La racine du dépôt est la racine du workspace.
[workspace]
resolver = "2"
members = [
    "crates/shooty-game",
    "crates/shooty-native",
    "crates/shooty-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
authors = ["Holaf"]
repository = "https://github.com/grokuku/Shooty"

# Le moteur (`het-*`) est consommé par tag. Pour développer contre une copie locale,
# créer `.cargo/config.toml` avec un `[patch."https://github.com/grokuku/HET"]`
# (gitignoré : voir README) — jamais dans ce manifeste.
[workspace.dependencies]
het-core = { git = "https://github.com/grokuku/HET", tag = "v0.1.0" }
het-app = { git = "https://github.com/grokuku/HET", tag = "v0.1.0" }
het-term = { git = "https://github.com/grokuku/HET", tag = "v0.1.0" }
het-web = { git = "https://github.com/grokuku/HET", tag = "v0.1.0" }

# Version épinglée exactement : un désaccord crate/CLI (`wasm-bindgen`) produit des
# erreurs d'import à l'exécution, illisibles. `wasm-pack` télécharge le CLI de la
# version du `Cargo.lock`.
wasm-bindgen = "=0.2.130"

# Jamais d'`unwrap`/`expect` hors tests, jamais d'`unsafe`.
# Les crates optent pour ces règles via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
