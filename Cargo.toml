# Workspace Shooty — le jeu. Le moteur de rendu vit dans HET (dépendances `git` épinglées sur une révision).
# La racine du dépôt est la racine du workspace.
[workspace]
resolver = "2"
members = [
    "crates/shooty-game",
    "crates/shooty-native",
    "crates/shooty-web",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
authors = ["Holaf"]
repository = "https://github.com/grokuku/Shooty"

# Le moteur (`het-*`) est consommé par révision (`rev`). Pour développer contre
# une copie locale, créer `.cargo/config.toml` avec un
# `[patch."https://github.com/grokuku/HET"]` (gitignoré : voir README) — jamais
# dans ce manifeste.
# Épinglé sur la révision dbac58063dd32997cedbe5b3cee83a2abc37c50d ; pour mettre
# à jour le moteur, changer ce sha (et nulle part ailleurs).
[workspace.dependencies]
het-core = { git = "https://github.com/grokuku/HET", rev = "dbac58063dd32997cedbe5b3cee83a2abc37c50d" }
het-app = { git = "https://github.com/grokuku/HET", rev = "dbac58063dd32997cedbe5b3cee83a2abc37c50d" }
het-term = { git = "https://github.com/grokuku/HET", rev = "dbac58063dd32997cedbe5b3cee83a2abc37c50d" }
het-web = { git = "https://github.com/grokuku/HET", rev = "dbac58063dd32997cedbe5b3cee83a2abc37c50d" }

# Version épinglée exactement : un désaccord crate/CLI (`wasm-bindgen`) produit des
# erreurs d'import à l'exécution, illisibles. `wasm-pack` télécharge le CLI de la
# version du `Cargo.lock`.
wasm-bindgen = "=0.2.130"

# Jamais d'`unwrap`/`expect` hors tests, jamais d'`unsafe`.
# Les crates optent pour ces règles via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
