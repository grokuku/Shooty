    <!-- Aucun framework CSS : une feuille inline suffit (§B.3). -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #05070a;
        --fg: #b8c7d9;
        --dim: #6b7c8f;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, "SF Mono", "Cascadia Mono", "DejaVu Sans Mono",
          "Liberation Mono", monospace;
        font-size: 12px;
      }

      /* Le canvas remplit tout l'écran ; sa résolution interne est en pixels device. */
      #stage {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: var(--bg);
      }

      #view {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }

      /* HUD DOM minimal, en bas à gauche (les compteurs « produit » vivent dans les
         cellules via `P`/`Tab` ; ce HUD est celui de la coquille web). */
      #hud {
        position: fixed;
        left: 8px;
        bottom: 8px;
        padding: 6px 8px;
        white-space: pre;
        line-height: 1.35;
        color: var(--fg);
        background: rgba(5, 7, 10, 0.72);
        border: 1px solid rgba(184, 199, 217, 0.18);
        border-radius: 3px;
        font-size: 11px;
        pointer-events: none;
        user-select: none;
      }

      #hud.hidden {
        display: none;
      }

      /* Panneau d'erreur : DOM statique stylé, pas d'alert (§F.7). */
      #error {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
        padding: 48px;
        background: rgba(5, 7, 10, 0.96);
        color: var(--fg);
        line-height: 1.5;
      }

      #error h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: #e8c07a;
      }

      #error p {
        margin: 0;
        max-width: 80ch;
      }

      #error p.hint {
        color: var(--dim);
        font-size: 11px;
      }
    </style>
  </head>

window.addEventListener('unhandledrejection', (event) => {
    showError('BOOT_FAILED', describe(event.reason));
});
void boot();
